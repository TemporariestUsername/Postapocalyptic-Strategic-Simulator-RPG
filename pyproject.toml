[project]
name = "pssrpg"
version = "0.0.1"
description = "Postapocalyptic Strategic Simulator RPG"
requires-python = ">=3.11"
dependencies = [
    "tcod>=16.2",
]

[project.scripts]
pssrpg = "pssrpg.simulate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pssrpg"]
